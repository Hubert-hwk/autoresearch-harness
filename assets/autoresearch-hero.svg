<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">autoresearch-harness</title>
  <desc id="desc">An auditable path from task to experiment, verification, replay, and evidence memory.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#071426"/>
      <stop offset="0.52" stop-color="#102a43"/>
      <stop offset="1" stop-color="#16324f"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#34d399"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="360" rx="28" fill="url(#bg)"/>
  <circle cx="1090" cy="55" r="150" fill="#38bdf8" opacity="0.07"/>
  <circle cx="80" cy="335" r="190" fill="#34d399" opacity="0.06"/>
  <g transform="translate(80 78)">
    <text x="0" y="48" fill="#f8fafc" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="50" font-weight="700">autoresearch-harness</text>
    <rect x="0" y="74" width="520" height="5" rx="2.5" fill="url(#accent)"/>
    <text x="0" y="118" fill="#cbd5e1" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="22">Auditable empirical optimization for agents and engineers</text>
    <text x="0" y="158" fill="#7dd3fc" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="16">bounded search · immutable evidence · verification-gated memory</text>
  </g>
  <g transform="translate(710 72)" font-family="Inter,Segoe UI,Arial,sans-serif">
    <path d="M70 45 H215 M215 45 V110 M215 110 H350 M350 110 V175" fill="none" stroke="url(#accent)" stroke-width="4" stroke-linecap="round" opacity="0.85"/>
    <path d="M215 110 V240 H350" fill="none" stroke="#64748b" stroke-width="3" stroke-linecap="round" stroke-dasharray="7 8"/>
    <g filter="url(#glow)"><circle cx="70" cy="45" r="10" fill="#38bdf8"/></g>
    <circle cx="215" cy="110" r="10" fill="#7dd3fc"/>
    <circle cx="350" cy="175" r="10" fill="#34d399"/>
    <circle cx="350" cy="240" r="8" fill="#94a3b8"/>
    <text x="0" y="20" fill="#e2e8f0" font-size="16" font-weight="600">TASK</text>
    <text x="145" y="85" fill="#e2e8f0" font-size="16" font-weight="600">EXPERIMENT</text>
    <text x="310" y="150" fill="#bbf7d0" font-size="16" font-weight="600">EVIDENCE</text>
    <text x="305" y="275" fill="#94a3b8" font-size="14">RETAINED FAILURE</text>
  </g>
  <text x="80" y="320" fill="#64748b" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="14">TASKSPEC → SEARCH → EVALUATE → VERIFY → REPLAY → REMEMBER</text>
  <text x="1120" y="320" text-anchor="end" fill="#64748b" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="14">v0.3</text>
</svg>
